name: FH6 Painter CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  # 任務 1：極速 Linux 代碼風格與語法檢查 (與單元測試並行)
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Ruff Check
      uses: astral-sh/ruff-action@v3
      with:
        args: "check --output-format=github ."

    - name: Run Ruff Format Verification
      uses: astral-sh/ruff-action@v3
      with:
        args: "format --check ."

  # 任務 2：跨平台單元測試與邏輯驗證
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Upgrade pip and install core requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install testing tools
      run: |
        pip install pytest

    - name: Execute automated test suite
      run: |
        python -m pytest -v

  # 任務 3：建置與封裝發行版 (依賴 test 與 lint 通過)
  build-release:
    needs: [test, lint]
    runs-on: windows-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'

    - name: Install requirements & PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Build Standalone Windows Executable
      shell: cmd
      run: |
        call build_release.bat

    - name: Prepare Portable Release Folder
      shell: cmd
      run: |
        mkdir PortableRelease
        copy dist\FH6-Painter.exe PortableRelease\

    - name: Upload build artifact preview
      uses: actions/upload-artifact@v4
      with:
        name: FH6-Painter_Windows_Portable
        path: PortableRelease/
        retention-days: 7