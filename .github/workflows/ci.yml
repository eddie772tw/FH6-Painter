name: FH6 Painter CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  # 任務 1：極速 Linux 代碼風格與語法檢查 (與單元測試並行)
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Ruff Check
      uses: astral-sh/ruff-action@v3
      with:
        args: "check --output-format=github ."

    - name: Run Ruff Format Verification
      uses: astral-sh/ruff-action@v3
      with:
        args: "format --check ."

  # 任務 2：跨平台單元測試與邏輯驗證
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install System GUI Dependencies (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb python3-tk

    - name: Upgrade pip and install core requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install testing tools
      run: |
        pip install pytest

    - name: Execute automated test suite (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        python -m pytest -v

    - name: Execute automated test suite with xvfb (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        xvfb-run python -m pytest -v

  # 任務 3：建置與封裝發行版 (依賴 test 與 lint 通過)
  build-release:
    needs: [test, lint]
    runs-on: windows-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'

    - name: Install requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build PyInstaller from source (custom bootloader)
      shell: pwsh
      run: |
        # 從原始碼編譯 PyInstaller bootloader，產生唯一的二進位特徵碼
        # 避免與預編譯 bootloader 共用的惡意軟體特徵碼匹配，大幅降低防毒誤報
        git clone --depth 1 https://github.com/pyinstaller/pyinstaller.git pyinstaller-src
        cd pyinstaller-src/bootloader
        python ./waf all
        cd ..
        pip install .

    - name: Build Standalone Windows Executable
      shell: pwsh
      run: |
        # 呼叫 PyInstaller 封裝獨立 EXE，模擬 build_release.bat 的核心編譯參數
        # --noupx: 停用 UPX 壓縮以降低防毒誤報
        # --exclude-module: 排除不必要的標準庫模組
        pyinstaller --noconfirm --name "FH6_Painter_Studio" --windowed --noupx --version-file file_version_info.txt --icon icon.ico --collect-all "taichi" --add-data "evaluators/*;evaluators" --add-data "tools/*;tools" --exclude-module unittest --exclude-module pydoc --exclude-module doctest --exclude-module xmlrpc --exclude-module ftplib --exclude-module email --exclude-module html --exclude-module http.server fh6_painter_studio_gui.py
        
        # 複製外置配置資源至 dist 發行目錄中
        if (Test-Path "settings") {
            Copy-Item -Path "settings" -Destination "dist/FH6_Painter_Studio/settings" -Recurse -Force
        }


    - name: Compress standalone bundle to ZIP
      shell: pwsh
      run: |
        Compress-Archive -Path "dist/FH6_Painter_Studio" -DestinationPath "FH6_Painter_Studio_Windows.zip" -Force

    - name: Upload build artifact preview
      uses: actions/upload-artifact@v4
      with:
        name: FH6_Painter_Studio_Windows_Preview
        path: FH6_Painter_Studio_Windows.zip
        retention-days: 7