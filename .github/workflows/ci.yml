name: FH6 Painter CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# 定義全域變數，方便未來統一升級版本
env:
  PYINSTALLER_VERSION: "v6.11.1" 

jobs:
  # 任務 1：代碼風格與語法檢查
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Ruff Check
      uses: astral-sh/ruff-action@v3
      with:
        args: "check --output-format=github ."

    - name: Run Ruff Format Verification
      uses: astral-sh/ruff-action@v3
      with:
        args: "format --check ."

  # 任務 2：單元測試與邏輯驗證
  test:
    needs: [lint]
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'

    - name: Upgrade pip and install requirements and pytest
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Execute automated test suite
      run: |
        python -m pytest -v

  # 任務 2.5：獨立並行自編譯 PyInstaller
  build-pyinstaller:
    runs-on: windows-latest
    # if: github.ref == 'refs/heads/main'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip' # 啟用 pip 快取

    # 檢查是否有先前編譯好的 PyInstaller 快取
    - name: Cache PyInstaller Wheel
      id: cache-pyinstaller
      uses: actions/cache@v4
      with:
        path: dist-pyinstaller/
        key: pyinstaller-wheel-${{ runner.os }}-${{ env.PYINSTALLER_VERSION }}-py3.13

    # 如果沒命中快取，才進行下載與手動編譯
    - name: Manually compile PyInstaller Bootloader & Package as Wheel
      if: steps.cache-pyinstaller.outputs.cache-hit != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install wheel
        git clone --depth 1 --branch ${{ env.PYINSTALLER_VERSION }} https://github.com/pyinstaller/pyinstaller.git
        cd pyinstaller
        cd bootloader
        python waf configure build install
        cd ..
        pip wheel . --wheel-dir=../dist-pyinstaller --no-deps

    - name: Upload PyInstaller Wheel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pyinstaller-wheel
        path: dist-pyinstaller/
        retention-days: 1 # 暫存檔，完成後即可丟棄

  # 任務 3：建置與封裝發行版
  build-release:
    needs: [test, lint, build-pyinstaller] # 額外依賴 build-pyinstaller
    runs-on: windows-latest
    # if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'

    # 1. 下載剛剛並行編譯好的 PyInstaller Wheel
    - name: Download PyInstaller Wheel
      uses: actions/download-artifact@v4
      with:
        name: pyinstaller-wheel
        path: dist-pyinstaller

    # 2. 安裝 requirements 項目以及本地的 PyInstaller Wheel
    # 使用 shell: bash 確保 Windows 環境下能正確展開「*.whl」萬用字元
    - name: Install requirements & Compiled PyInstaller
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install dist-pyinstaller/*.whl
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    # 引入 Rust 快取，大幅加速 build_release.bat 中可能含有的 Rust 編譯過程
    - name: Rust Cache
      uses: swatinem/rust-cache@v2

    - name: Build Standalone Windows Executable
      shell: cmd
      run: |
        mkdir Release
        call build_release.bat
        copy dist\FH6-Painter.exe Release\

    - name: Upload build artifact preview
      uses: actions/upload-artifact@v4
      with:
        name: FH6-Painter
        path: Release/
        retention-days: 7