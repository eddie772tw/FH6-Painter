name: FH6 Painter CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Run Ruff Check & Format
      uses: astral-sh/ruff-action@v3
      with:
        args: "check --output-format=github ."
    
    - name: Run Ruff Format Verification
      uses: astral-sh/ruff-action@v3
      with:
        args: "format --check ."

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' 

    - name: Upgrade pip and install core requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install & Execute automated test suite
      run: |
        pip install pytest
        python -m pytest -v

  build-release:
    needs: test
    runs-on: windows-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'

    - name: Install requirements & PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Standalone Windows Executable
      shell: pwsh
      run: |
        # 呼叫 PyInstaller 封裝獨立 EXE，模擬 build_release.bat 的核心編譯參數
        pyinstaller --noconfirm --name "FH6_Painter_Studio" --windowed --collect-all "taichi" --add-data "evaluators/*;evaluators" --add-data "tools/*;tools" fh6_painter_studio_gui.py
        
        # 複製外置配置資源至 dist 發行目錄中
        if (Test-Path "settings") {
            Copy-Item -Path "settings" -Destination "dist/FH6_Painter_Studio/settings" -Recurse -Force
        }
        if (Test-Path "optimization_settings.json") {
            Copy-Item -Path "optimization_settings.json" -Destination "dist/FH6_Painter_Studio/" -Force
        }

    - name: Compress standalone bundle to ZIP
      shell: pwsh
      run: |
        Compress-Archive -Path "dist/FH6_Painter_Studio" -DestinationPath "FH6_Painter_Studio_Windows.zip" -Force

    - name: Upload build artifact preview
      uses: actions/upload-artifact@v4
      with:
        name: FH6_Painter_Studio_Windows_Preview
        path: FH6_Painter_Studio_Windows.zip
        retention-days: 7
auto-fix:
    needs: test
    runs-on: ubuntu-latest
    
    # 關鍵門檻 1：只有當 test Job 失敗時才觸發
    # 關鍵門檻 2：檢查 commit 訊息，如果開頭是 "style: auto format" 則跳過，防止無限循環
    if: |
      failure() && 
      !contains(github.event.head_commit.message, 'style: auto format')
    
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref || github.ref_name }}

    - name: Run Ruff Format and Fix
      uses: astral-sh/ruff-action@v3
      with:
        args: "format ."

    - name: Run Ruff Lint Fix
      uses: astral-sh/ruff-action@v3
      with:
        args: "check --fix --exit-zero ."

    - name: Commit and Push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "style: auto format code with ruff [skip ci]"
        